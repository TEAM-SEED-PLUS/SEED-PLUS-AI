name: Prod CD Pipeline (AI)

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: ECR commit SHA image tag to deploy
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  deploy-to-aws:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve existing image tag from merged PR
        id: resolve-image
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('image_tag', context.payload.inputs.image_tag);
              return;
            }
            const message = context.payload.head_commit?.message || '';
            const match = message.match(/Merge pull request #(\d+) from /);
            if (!match) {
              core.setFailed('Merge develop into main using a GitHub PR merge commit, or deploy manually with image_tag.');
              return;
            }
            const { owner, repo } = context.repo;
            const pr = await github.rest.pulls.get({
              owner, repo, pull_number: Number(match[1])
            });
            core.setOutput('image_tag', pr.data.head.sha);

      - name: Checkout Infra repository
        uses: actions/checkout@v4
        with:
          repository: TEAM-SEED-PLUS/SEED-PLUS-INFRA
          ref: main
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra-repo

      - name: Install Ansible
        run: python -m pip install ansible

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CD_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Install Session Manager plugin
        run: |
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" \
            -o session-manager-plugin.deb
          sudo dpkg -i session-manager-plugin.deb

      - name: Set up SSH key and SSM config
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config << 'EOF'
          Host i-*
              ProxyCommand sh -c "aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters 'portNumber=%p'"
              StrictHostKeyChecking no
              IdentityFile ~/.ssh/id_rsa
          EOF

      - name: Deploy AI to AWS App
        env:
          APP_ENV_CONTENT: ${{ secrets.ENV_FILE_PROD }}
          APP_INSTANCE_ID: ${{ secrets.APP_INSTANCE_ID }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.resolve-image.outputs.image_tag }}
        run: |
          cd infra-repo/aws-cd
          ansible-playbook -i "$APP_INSTANCE_ID," -u ubuntu \
            -e "ecr_registry=$ECR_REGISTRY ecr_repository=$ECR_REPOSITORY image_tag=$IMAGE_TAG aws_region=ap-northeast-2" \
            playbooks/aws_ai_deploy.yml
